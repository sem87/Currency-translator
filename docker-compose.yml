# docker-compose.yml
services:  # Список сервисов (контейнеров)
  # FastAPI приложение
  web:
    build: .  # Сборка из Dockerfile в текущей папке
    image: sem87sem/translator:latest # или из имейдж
    container_name: translator  # Имя контейнера
    ports:
      - "30:8000"  # "хост:контейнер"
    environment:  # Переменные окружения
      - DOCKER_ENV=true  # Флаг для отключения reload
      - DATABASE_URL=sqlite:///./app/books.db
    volumes:  # Монтирование папок
      - .:/app  # Синхронизация кода (для разработки)
      - ./logs:/app/logs  # Логи сохраняются на хосте
      - ./jey.json:/app/jey.json  # Мой джесон
      - ./books.db:/app/books.db # управляем базой данных
    restart: unless-stopped  # Перезапуск при падении
#    networks:
#      app_network:
#        driver: bridge
